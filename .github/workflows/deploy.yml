name: CI/CD Pipeline - FarmGo Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: 🧪 Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Shared Package
        run: pnpm --filter farmgo-shared build

      - name: 🧪 Run Backend Unit & Integration Tests
        run: pnpm test

      - name: 🏗️ Build All Packages (Shared, Backend, Frontend)
        run: pnpm build

      - name: 📊 Type-Check All Workspaces
        run: |
          pnpm --filter farmgo-shared exec tsc --noEmit
          pnpm --filter farmgo-backend exec tsc --noEmit
          pnpm --filter farmgo-frontend exec tsc --noEmit

  deploy-backend-render:
    name: 🚀 Trigger Render Backend Deploy
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📡 Call Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render Production Deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK" -f || echo "Deploy hook executed"

  deploy-frontend-vercel:
    name: 🌐 Deploy Frontend to Vercel
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install Dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 🚀 Deploy to Vercel Action (if secrets present)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod --token="$VERCEL_TOKEN" --yes --cwd=frontend
