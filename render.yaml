services:
  # ==========================================
  # FarmGo Backend API Service (Free Tier)
  # ==========================================
  - type: web
    name: farmgo-backend
    env: node
    plan: free
    region: singapore
    buildCommand: pnpm install --prod=false && pnpm --filter farmgo-shared build && pnpm --filter farmgo-backend build
    startCommand: pnpm --filter farmgo-backend start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      # Connect your free Neon/Supabase PostgreSQL database URL below:
      - key: DATABASE_URL
        sync: false
